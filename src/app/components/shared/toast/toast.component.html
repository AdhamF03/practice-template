<div class="toast-container position-fixed bottom-0 end-0 p-3" *ngIf="isVisible">
  <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Notification</strong>
      <button type="button" class="btn-close" (click)="isVisible = false" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      <i class="material-symbols-outlined me-1">check_circle</i>{{ message }}
      <button class="cart-button" [routerLink]="['/cart']">View Cart</button>
    </div>
  </div>
</div>
