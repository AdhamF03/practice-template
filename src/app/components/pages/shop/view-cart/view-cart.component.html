<div class="container-fluid">
  <div class="cart-title container">
    <h1>Cart</h1>
  </div>
  <div class="container cart-container">
    <div class="cart-items">
      <table mat-table [dataSource]="cartItems" class="mat-elevation-z8">
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef>Product</th>
          <td mat-cell *matCellDef="let item">
            <img [src]="item.product.mainImage" alt="{{ item.product.name }}" [routerLink]="['/shop', item.product.id]" />
            <span>{{ item.product.name }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Price</th>
          <td mat-cell *matCellDef="let item">
            ${{ item.product.currentPrice }}
          </td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Quantity</th>
          <td mat-cell *matCellDef="let item" class="quantity-selector">
            <button (click)="decreaseQuantity(item)">-</button>
            <span>{{ item.quantity }}</span>
            <button (click)="increaseQuantity(item)">+</button>
          </td>
        </ng-container>

        <ng-container matColumnDef="subtotal">
          <th mat-header-cell *matHeaderCellDef>Subtotal</th>
          <td mat-cell *matCellDef="let item">
            ${{ item.product.currentPrice * item.quantity }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let item">
            <button (click)="removeItem(item)">Remove</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
    <div class="cart-totals">
      <h2>Cart totals</h2>
      <div>
        <span>Subtotal: </span>
        <span>${{ getSubtotal() }}</span>
      </div>

      <button [routerLink]="['/checkout']">PROCEED TO CHECKOUT</button>

    </div>
  </div>
</div>
<app-scroll-to-top></app-scroll-to-top>
